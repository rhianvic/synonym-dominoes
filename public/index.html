<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synonym Dominoes: Actions &amp; Reuse</title>
<style>
:root{--bg:#fbf6ee;--fg:#2b2118;--card:#fff;--ac:#d9701a;--mut:#85766a;--bd:#e5d6c3;--ok:#2f8f5b;--end:#ffe3bf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1713;--fg:#f3e9dc;--card:#2a231c;--ac:#f08c33;--mut:#a89888;--bd:#443a2f;--ok:#57c58b;--end:#5a3c1c}}
:root[data-theme="dark"]{--bg:#1c1713;--fg:#f3e9dc;--card:#2a231c;--ac:#f08c33;--mut:#a89888;--bd:#443a2f;--ok:#57c58b;--end:#5a3c1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:1000px;margin:0 auto;padding:16px;display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:800px){#app{grid-template-columns:1fr 280px}}
h1{margin:0;font-size:22px;grid-column:1/-1}h1 small{display:block;font-size:13px;color:var(--mut);font-weight:400}
h2{margin:0 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
button,input{font:inherit;color:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;margin:4px 6px 0 0}
.btn.alt{background:transparent;color:var(--fg);border:1px solid var(--bd)}
input{padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pl{padding:3px 10px;border:1px solid var(--bd);border-radius:99px;font-size:14px}
.pl.turn{background:var(--ac);color:#fff;border-color:var(--ac)}
.board{display:flex;gap:6px;overflow-x:auto;padding:8px 2px}
.t{display:flex;flex:none;border:2px solid var(--fg);border-radius:8px;background:var(--card);overflow:hidden;padding:0;text-align:center}
.t span{display:flex;align-items:center;justify-content:center;width:92px;min-height:52px;padding:4px;font-size:13px;line-height:1.2}
.t span+span{border-left:2px dashed var(--bd)}
.t .end{background:var(--end);font-weight:600}
.hand{cursor:pointer;opacity:.55}.hand.ok{opacity:1;border-color:var(--ok)}.hand.sel{outline:3px solid var(--ac)}
.msg{color:var(--mut);font-size:14px;min-height:20px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px 4px;text-align:left;border-bottom:1px solid var(--bd)}td:nth-child(n+3),th:nth-child(n+3){text-align:right}
.me{font-weight:700}
</style></head><body>
<div id="app"><div class="card">Loading…</div></div>
<script>
const G=[["reuse","use it again","give it another use"],["recycle","give an eco-friendly end","turn waste into new material"],["repair","fix","mend"],["donate","give away","hand over for free"],["reduce","cut down","use less"],["repurpose","convert for a new use","find a new function"],["throw away","discard","get rid of"],["refill","fill up again","top up"],["upcycle","turn old into better","give old things new value"],["swap","exchange","trade"]];
const $=s=>document.querySelector(s),clone=o=>JSON.parse(JSON.stringify(o));
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let db,me,S=null,P={},SC={},sel=null,ready=false,nick="",note="";
const myName=()=>(S&&S.names&&S.names[me])||(P[me]&&P[me].name)||nick||"Player";
function connect(){return new Promise((res,rej)=>{const ws=new WebSocket((location.protocol=="https:"?"wss://":"ws://")+location.host),docs={},ls=[];
 const fire=()=>ls.forEach(f=>f()),send=o=>ws.send(JSON.stringify(o));
 const db={doc:p=>({set:async d=>{docs[p]=JSON.parse(JSON.stringify(d));send({t:"set",p,d});fire()},delete:async()=>{delete docs[p];send({t:"del",p});fire()},
  onSnapshot:cb=>{const f=()=>cb({id:p.split("/").pop(),exists:p in docs,data:()=>docs[p]});ls.push(f);f()}}),
  collection:c=>({onSnapshot:cb=>{const f=()=>cb({docs:Object.keys(docs).filter(k=>k.startsWith(c+"/")&&!k.slice(c.length+1).includes("/")).map(k=>({id:k.split("/").pop(),data:()=>docs[k]}))});ls.push(f);f()}})};
 ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.t=="all"){Object.assign(docs,m.docs);res(db)}else if(m.t=="set")docs[m.p]=m.d;else if(m.t=="del")delete docs[m.p];fire()};
 ws.onerror=()=>rej();ws.onclose=()=>{note="Disconnected. Reload the page.";render()};
 setInterval(()=>{if(ws.readyState==1)send({t:"ping"})},25000)})}
(async()=>{
 try{me=localStorage.dmid||(localStorage.dmid=Math.random().toString(36).slice(2,10));db=await connect()}catch(e){}
 if(!db||!me){ready=true;render();return}
 db.doc("game/state").onSnapshot(s=>{S=s.exists?s.data():null;ready=true;sel=null;note="";render()},e=>{note="Connection problem: "+e.message;ready=true;render()});
 db.collection("players").onSnapshot(q=>{P={};q.docs.forEach(d=>P[d.id]=d.data());render()});
 db.collection("scores").onSnapshot(q=>{SC={};q.docs.forEach(d=>SC[d.id]=d.data());render()});
 setTimeout(()=>{if(!ready){ready=true;render()}},10000);
})();
function deck(){const d=[],pk=g=>G[g][Math.random()*3|0];
 for(let a=0;a<G.length;a++)for(let b=a;b<G.length;b++){const x=pk(a);let y=pk(b);if(a==b)while(y==x)y=pk(b);d.push({a:x,x:a,b:y,y:b})}
 return d.sort(()=>Math.random()-.5)}
const flip=p=>({a:p.b,x:p.y,b:p.a,y:p.x});
const put=ns=>db.doc("game/state").set(ns);
function join(){const n=nick.trim().slice(0,20);if(!n){note="Type a nickname first.";render();return}db.doc("players/"+me).set({name:n})}
function leave(){db.doc("players/"+me).delete()}
function start(){const ids=Object.keys(P);if(ids.length<2){note="Wait for more players.";render();return}
 const d=deck(),per=ids.length>6?6:7,order=ids.sort(()=>Math.random()-.5),hands={},names={};
 order.forEach(i=>{hands[i]=d.splice(0,per);names[i]=P[i].name});
 put({phase:"play",order,names,hands,yard:d,chain:[],turn:0,passes:0,winner:null,log:"Game started! "+names[order[0]]+" goes first."})}
function backToLobby(){put({phase:"lobby"})}
function addScore(pts,win){const c=SC[me]||{points:0,wins:0};db.doc("scores/"+me).set({name:myName(),points:c.points+pts,wins:c.wins+(win?1:0)})}
async function play(i,side){const ns=clone(S),h=ns.hands[me],c=ns.chain;let p=h.splice(i,1)[0];
 if(!c.length)c.push(p);
 else if(side=="R"){if(p.x!=c[c.length-1].y)p=flip(p);c.push(p)}
 else{if(p.y!=c[0].x)p=flip(p);c.unshift(p)}
 const win=h.length==0;ns.passes=0;ns.log=myName()+" matched “"+p.a+"” with “"+p.b+"”";
 if(win){ns.phase="over";ns.winner=me;ns.log+=" and won the round!"}else ns.turn=(ns.turn+1)%ns.order.length;
 await put(ns);addScore(10+(win?30:0),win)}
async function draw(){const ns=clone(S);ns.hands[me].push(ns.yard.pop());ns.log=myName()+" drew a tile";await put(ns)}
async function pass(){const ns=clone(S);ns.passes++;ns.log=myName()+" passed";
 if(ns.passes>=ns.order.length){let b=ns.order[0];ns.order.forEach(i=>{if(ns.hands[i].length<ns.hands[b].length)b=i});ns.phase="over";ns.winner=b;ns.log="Blocked game: fewest tiles wins."}
 else ns.turn=(ns.turn+1)%ns.order.length;await put(ns)}
function pick(i){if(!S||S.phase!="play"||S.order[S.turn]!=me)return;
 const p=S.hands[me][i],c=S.chain;if(!c.length){play(i,"R");return}
 const L=c[0],R=c[c.length-1],l=p.x==L.x||p.y==L.x,r=p.x==R.y||p.y==R.y;
 if(!l&&!r){note="No match: look for a synonym of an end term.";render();return}
 if(l&&r&&L.x!=R.y){sel=i;render();return}
 play(i,r?"R":"L")}
const tile=(p,cls,extra)=>`<div class="t ${cls||""}" ${extra||""}><span>${esc(p.a)}</span><span>${esc(p.b)}</span></div>`;
function rank(){const rows=Object.entries(SC).sort((a,b)=>b[1].points-a[1].points);
 return `<div class="card"><h2>🏆 Ranking</h2>${rows.length?`<table><tr><th>#</th><th>Player</th><th>Pts</th><th>Wins</th></tr>${rows.map(([id,s],i)=>`<tr class="${id==me?"me":""}"><td>${i+1}</td><td>${esc(s.name)}</td><td>${s.points}</td><td>${s.wins}</td></tr>`).join("")}</table>`:`<p class="msg">No points yet. Be the first!</p>`}<p class="msg">+10 per match, +30 for winning a round.</p></div>`}
function lobby(){const ids=Object.keys(P);
 return `<div class="card"><h2>Lobby</h2><p>Match each tile with a <b>synonym</b> of the end word. Ideal: 4 or more players.</p>
 ${P[me]?`<div class="row">${ids.map(i=>`<span class="pl ${i==me?"turn":""}">${esc(P[i].name)}</span>`).join("")}</div><button class="btn" onclick="start()">Start game (${ids.length} joined)</button><button class="btn alt" onclick="leave()">Leave</button>`
 :`<div class="row"><input id="nick" maxlength="20" placeholder="Your nickname" value="${esc(nick)}" oninput="nick=this.value"><button class="btn" onclick="join()">Join</button></div>${ids.length?`<p class="msg">Waiting: ${ids.map(i=>esc(P[i].name)).join(", ")}</p>`:""}`}
 <p class="msg">${esc(note)}</p></div>`}
function game(){const c=S.chain,cur=S.order[S.turn],mine=cur==me&&S.phase=="play",h=S.hands[me]||[],L=c[0],R=c[c.length-1];
 const can=p=>!c.length||p.x==L.x||p.y==L.x||p.x==R.y||p.y==R.y,has=h.some(can),over=S.phase=="over";
 let ctl="";
 if(over)ctl=`<b>🎉 ${esc(S.names[S.winner])} wins!</b> <button class="btn" onclick="backToLobby()">Back to lobby</button>`;
 else if(mine&&!has)ctl=S.yard.length?`<button class="btn" onclick="draw()">Draw a tile (${S.yard.length} left)</button>`:`<button class="btn" onclick="pass()">No moves: pass</button>`;
 else if(sel!==null)ctl=`<button class="btn" onclick="play(sel,'L')">◀ Left: ${esc(L.a)}</button><button class="btn" onclick="play(sel,'R')">Right: ${esc(R.b)} ▶</button>`;
 else ctl=mine?"<b>Your turn!</b> Pick a green tile.":`Waiting for <b>${esc(S.names[cur])}</b>…`;
 return `<div class="card"><div class="row">${S.order.map(i=>`<span class="pl ${i==cur&&!over?"turn":""}">${esc(S.names[i])}${i==me?" (you)":""}: ${S.hands[i].length}</span>`).join("")}</div>
 <div class="board">${c.length?c.map((p,i)=>`<div class="t"><span class="${i==0?"end":""}">${esc(p.a)}</span><span class="${i==c.length-1?"end":""}">${esc(p.b)}</span></div>`).join(""):`<span class="msg">Empty board: the first tile can be anything.</span>`}</div>
 <p class="msg">${esc(S.log||"")}</p><div>${ctl}</div><p class="msg">${esc(note)}</p></div>
 ${S.order.includes(me)?`<div class="card"><h2>Your tiles</h2><div class="row">${h.map((p,i)=>tile(p,"hand "+(mine&&can(p)?"ok":"")+(sel===i?" sel":""),`onclick="pick(${i})"`)).join("")}</div></div>`:`<div class="card msg">You’re watching this round.</div>`}`}
function render(){const a=$("#app");if(!ready)return;
 if(!db||!me){a.innerHTML=`<h1>Synonym Dominoes</h1><div class="card"><h2>Can’t connect</h2><p>The game server is not responding. Reload the page in a few seconds.</p></div>`;return}
 const f=document.activeElement&&document.activeElement.id=="nick";
 a.innerHTML=`<h1>🎲 Synonym Dominoes<small>Theme: Actions &amp; Reuse. Match each end with a word that means the same thing.</small></h1><div style="display:grid;gap:14px">${S&&S.phase&&S.phase!="lobby"&&S.order?game():lobby()}</div>${rank()}`;
 if(f){const n=$("#nick");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}}
</script></body></html>
